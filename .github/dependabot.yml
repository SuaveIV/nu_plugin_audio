version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"

    groups:
      nushell:
        patterns:
          - "nu-*"
      # Roll every non-Nushell patch bump into a single PR. Nushell is kept in
      # its own group because it needs manual code updates per release.
      cargo-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "nu-*"
        update-types:
          - "patch"

    open-pull-requests-limit: 3

    labels:
      - "dependencies"

    commit-message:
      prefix: "chore"

    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"

    labels:
      - "dependencies"
      - "github-actions"

    # Batch all action bumps into a single weekly PR instead of one PR per action.
    groups:
      github-actions:
        patterns:
          - "*"

    commit-message:
      prefix: "chore"
