[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# Whether to enable GitHub Attestations
github-attestations = true
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
# NOTE: aarch64-unknown-linux-gnu is excluded here because ALSA dependencies prevent
# cargo-dist cross-compilation. See .github/workflows/release-arm64.yml for the
# workflow that builds and uploads the ARM64 artifact.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc"
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
install-hint = "After installing, open Nushell and run:\n  plugin add <path-to-nu_plugin_audio>\n\n  On Unix-like systems: ~/.cargo/bin/nu_plugin_audio\n  On Windows: $env:USERPROFILE\\.cargo\\bin\\nu_plugin_audio.exe"
# Which actions to run on pull requests
pr-run-mode = "skip"

[dist.dependencies.apt]
libasound2-dev = "*"
pkg-config = "*"

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"actions/attest-build-provenance" = "4d101475d8b20a2381f78447822ac1eab6504dd8"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
